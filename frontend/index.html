<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGV — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232563EB%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Apply saved theme BEFORE page renders, so there's no flash of wrong theme
  (function() {
    let saved = 'light'; try { saved = localStorage.getItem('bgv-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root[data-theme="light"] {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --border: #ECECEC;
    --muted: #6B7280;
    --text: #1A1A1A;
    --accent: #2563EB;
    --accent-soft: #EFF4FF;
    --hover-row: #FAFBFC;
    --shadow: rgba(0,0,0,0.03);

    --green-bg: #DCFCE7; --green-text: #16A34A;
    --amber-bg: #FEF3C7; --amber-text: #D97706;
    --red-bg: #FEE2E2; --red-text: #DC2626;
    --grey-bg: #F1F5F9; --grey-text: #64748B;
  }

  :root[data-theme="dark"] {
    --bg: #0D0D0D;
    --surface: #161616;
    --border: #2A2A2A;
    --muted: #8A8A8A;
    --text: #EDEDED;
    --accent: #C9A04D;
    --accent-soft: #2A2316;
    --hover-row: #1C1C1C;
    --shadow: rgba(0,0,0,0.2);

    --green-bg: #14291C; --green-text: #4ADE80;
    --amber-bg: #2E2310; --amber-text: #F0B429;
    --red-bg: #2E1417; --red-text: #F0506E;
    --grey-bg: #1C1C1C; --grey-text: #8A8A8A;
  }
  /* ===== TOAST NOTIFICATION ===== */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    box-shadow: 0 4px 16px var(--shadow);
    min-width: 240px;
    max-width: 360px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toast-in 0.25s ease;
  }

  .toast.success { border-left-color: #16A34A; }
  .toast.error { border-left-color: #DC2626; }

  .toast-icon { font-size: 14px; flex-shrink: 0; }

  .toast.toast-out {
    animation: toast-out 0.2s ease forwards;
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toast-out {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(8px); }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .nav-links {
    display: flex;
    gap: 8px;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-links a:hover {
    background: var(--bg);
    color: var(--text);
  }

  .nav-links a.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .theme-toggle:hover {
    background: var(--bg);
    color: var(--text);
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 56px 120px;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px var(--shadow);
  }

  .stat-card.hero {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .stat-number {
    font-size: 40px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1;
  }

  .stat-card.hero .stat-number {
    font-size: 56px;
  }

  .stat-label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pill {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .pill.verified { background: var(--green-text); }
  .pill.partial { background: var(--amber-text); }
  .pill.failed { background: var(--red-text); }
  .pill.pending { background: var(--grey-text); }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 16px;
    font-weight: 600;
  }

  .upload-btn {
    background: var(--accent);
    border: none;
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
    font-family: inherit;
  }

  .upload-btn:hover:not(:disabled) {
    opacity: 0.88;
  }

  .candidate-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px var(--shadow);
  }

  .candidate-row {
    display: grid;
    grid-template-columns: 90px 1fr 140px 90px 24px;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s ease;
    gap: 16px;
  }

  .candidate-row:last-child { border-bottom: none; }

  .candidate-row:hover {
    background: var(--hover-row);
  }

  .candidate-row:hover .arrow {
    transform: translateX(4px);
    color: var(--accent);
  }

  .candidate-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .candidate-name {
    font-size: 15px;
    font-weight: 600;
  }

  .candidate-email {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    width: fit-content;
  }

  .status-pill.verified { background: var(--green-bg); color: var(--green-text); }
  .status-pill.partial { background: var(--amber-bg); color: var(--amber-text); }
  .status-pill.failed { background: var(--red-bg); color: var(--red-text); }
  .status-pill.pending { background: var(--grey-bg); color: var(--grey-text); }

  .doc-fingerprint {
    display: flex;
    gap: 4px;
  }

  .fp-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .fp-dot.filled { background: var(--accent); }
  .fp-dot.empty { background: var(--border); }

  .arrow {
    color: var(--muted);
    transition: transform 0.15s ease, color 0.15s ease;
    font-size: 14px;
  }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 13px; font-family: inherit; }
  .toolbar input[type="search"]:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .banner { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; font-size: 13px; display: none; }
  .banner.show { display: block; }
  .banner-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .banner .muted { color: var(--muted); margin-top: 4px; }
  .progress { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.4s ease; }
  .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .candidate-row:focus-visible { outline-offset: -2px; }

  .empty-state, .loading-state {
    padding: 56px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 720px) {
    nav { padding: 18px 24px; }
    main { padding: 32px 24px 80px; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .stat-card.hero { grid-column: 1 / -1; }
    .candidate-row { grid-template-columns: 60px 1fr 90px 16px; }
    .candidate-row .doc-fingerprint { display: none; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-links a, .theme-toggle { white-space: nowrap; }
  @media (max-width: 720px) {
    nav { flex-wrap: wrap; gap: 12px; }
    .nav-right { width: 100%; justify-content: space-between; }
    .nav-links { gap: 2px; overflow-x: auto; }
    .nav-links a { padding: 8px 10px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">BGV</div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html" class="active">Overview</a>
      <a href="review.html">Review</a>
      <a href="history.html">History</a>
      <a href="settings.html">Settings</a>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  </div>
</nav>

<main>
  <div class="page-title">Overview</div>

  <div class="stat-grid">
    <div class="stat-card hero">
      <div class="stat-number mono" id="totalCount">—</div>
      <div class="stat-label">Total candidates</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="verifiedCount">—</div>
      <div class="stat-label"><span class="pill verified"></span>Verified</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="partialCount">—</div>
      <div class="stat-label"><span class="pill partial"></span>Partial</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="failedCount">—</div>
      <div class="stat-label"><span class="pill failed"></span>Failed</div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">Candidates</div>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Upload Excel</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
  </div>

  <div class="banner" id="banner" role="status"></div>

  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search by name, email or ID" aria-label="Search candidates">
    <div class="chips" id="chips">
      <button class="chip active" data-status="">All</button>
      <button class="chip" data-status="completed">Verified</button>
      <button class="chip" data-status="partial">Partial</button>
      <button class="chip" data-status="failed">Failed</button>
      <button class="chip" data-status="pending">Pending</button>
    </div>
  </div>

  <div class="candidate-card">
    <div id="candidateList">
      <div class="loading-state">Loading candidates…</div>
    </div>
  </div>
</main>

<script src="common.js"></script>
<script>
  let allCandidates = [];
  let activeStatus = '';
  let stopWatching = null;

  async function loadDashboard() {
    try {
      const data = await api('/candidates/dashboard');
      document.getElementById('totalCount').textContent = data.total_candidates ?? 0;
      document.getElementById('verifiedCount').textContent = data.fully_verified ?? 0;
      document.getElementById('partialCount').textContent = data.partial_documents ?? 0;
      document.getElementById('failedCount').textContent = data.missing_documents ?? 0;
    } catch (err) {
      console.error('Dashboard load failed:', err);
    }
  }

  function fingerprint(received, required) {
    if (!required) return `<div class="doc-fingerprint" title="No required documents configured">${received} doc${received === 1 ? '' : 's'}</div>`;
    const filled = Math.min(received, required);
    let dots = '';
    for (let i = 0; i < required; i++) {
      dots += `<span class="fp-dot ${i < filled ? 'filled' : 'empty'}"></span>`;
    }
    return `<div class="doc-fingerprint" title="${filled} of ${required} required documents">${dots}</div>`;
  }

  function renderCandidates() {
    const listEl = document.getElementById('candidateList');
    const q = document.getElementById('searchInput').value.trim().toLowerCase();

    const shown = allCandidates.filter(c =>
      (!activeStatus || (activeStatus === 'pending' ? ['pending', 'processing'].includes(c.status) : c.status === activeStatus)) &&
      (!q || [c.candidate_id, c.name, c.email].some(v => String(v).toLowerCase().includes(q)))
    );

    if (!allCandidates.length) {
      listEl.innerHTML = '<div class="empty-state">No candidates yet. Upload an Excel file to get started.</div>';
    } else if (!shown.length) {
      listEl.innerHTML = '<div class="empty-state">No candidates match your search.</div>';
    } else {
      listEl.innerHTML = shown.map(c => `
        <div class="candidate-row" role="link" tabindex="0" data-id="${esc(c.candidate_id)}">
          <div class="candidate-id mono">${esc(c.candidate_id)}</div>
          <div>
            <div class="candidate-name">${esc(c.name)}</div>
            <div class="candidate-email">${esc(c.email)}</div>
          </div>
          <div class="status-pill ${statusClass(c.status)}">${statusLabel(c.status)}</div>
          ${fingerprint(c.docs_received, c.docs_required)}
          <div class="arrow">→</div>
        </div>
      `).join('');
    }
  }

  async function loadCandidates() {
    const listEl = document.getElementById('candidateList');
    try {
      const data = await api('/candidates');
      allCandidates = data.candidates || [];
      renderCandidates();
    } catch (err) {
      listEl.innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
    }
  }

  function openCandidate(row) {
    window.location.href = `candidate.html?id=${encodeURIComponent(row.dataset.id)}`;
  }

  document.getElementById('candidateList').addEventListener('click', e => {
    const row = e.target.closest('.candidate-row');
    if (row) openCandidate(row);
  });
  document.getElementById('candidateList').addEventListener('keydown', e => {
    const row = e.target.closest('.candidate-row');
    if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCandidate(row); }
  });

  document.getElementById('searchInput').addEventListener('input', renderCandidates);
  document.getElementById('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    activeStatus = chip.dataset.status;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
    renderCandidates();
  });

  // ----- batch banner: offer to process a fresh upload, and show live progress -----
  const banner = document.getElementById('banner');

  function showReady(batchId, message) {
    banner.innerHTML = `
      <div class="banner-row">
        <div>${message}</div>
        <button class="upload-btn" id="processBatchBtn">Process batch #${batchId}</button>
      </div>`;
    banner.classList.add('show');
    document.getElementById('processBatchBtn').addEventListener('click', () => startBatch(batchId));
  }

  function showProgress(s) {
    const failedNote = s.status_breakdown.failed ? ` · ${s.status_breakdown.failed} failed` : '';
    banner.innerHTML = `
      <div class="banner-row"><div><strong>Processing batch #${s.batch_id}</strong> — ${esc(s.filename)}
        <div class="muted">${s.finished_count} of ${s.total_candidates} candidates done${failedNote}</div></div>
        <div class="mono">${s.progress_percent}%</div></div>
      <div class="progress"><div style="width:${s.progress_percent}%"></div></div>`;
    banner.classList.add('show');
  }

  function followBatch(batchId) {
    if (stopWatching) stopWatching();
    stopWatching = watchBatch(batchId, s => { showProgress(s); loadDashboard(); loadCandidates(); }, s => {
      const ok = s.processing_status === 'completed';
      showToast(ok ? `Batch #${batchId} finished.` : `Batch #${batchId} stopped early — check the Settings connection, then process it again.`, ok ? 'success' : 'error');
      if (!ok) {
        showReady(batchId, `Batch #${batchId} stopped before finishing (${s.status_breakdown.pending} candidates still pending).`);
      } else {
        banner.classList.remove('show');
      }
      loadDashboard(); loadCandidates();
    });
  }

  async function startBatch(batchId) {
    const btn = document.getElementById('processBatchBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Starting…'; }
    try {
      await api(`/candidates/batch/${batchId}/process`, { method: 'POST' });
      followBatch(batchId);
    } catch (err) {
      showToast(err.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = `Process batch #${batchId}`; }
    }
  }

  // Pick up a batch that is already running (e.g. after a refresh).
  async function resumeRunningBatch() {
    try {
      const { batches } = await api('/batches');
      const running = batches.find(b => b.processing_status === 'processing');
      if (running) followBatch(running.batch_id);
    } catch (err) { console.error(err); }
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const input = e.target;
    const file = input.files[0];
    if (!file) return;

    try {
      const data = await postFile('/candidates/upload', file);
      let msg = `Added ${data.candidates_added} candidate${data.candidates_added === 1 ? '' : 's'}`;
      if (data.candidates_skipped) msg += `, skipped ${data.candidates_skipped} duplicate${data.candidates_skipped === 1 ? '' : 's'}`;
      if (data.invalid_count) msg += `, ${data.invalid_count} invalid row${data.invalid_count === 1 ? '' : 's'} ignored (first: row ${data.invalid_rows[0].row} – ${data.invalid_rows[0].reason})`;
      showToast(msg + '.', data.invalid_count ? 'error' : 'success');
      showReady(data.batch_id, `<strong>${esc(data.filename)}</strong> uploaded — ${data.candidates_added} candidates ready to verify.`);
      loadDashboard();
      loadCandidates();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      input.value = '';   // allow re-selecting the same file
    }
  });

  loadDashboard();
  loadCandidates();
  resumeRunningBatch();
</script>
</body>
</html>

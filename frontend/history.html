<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGV — History</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232563EB%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  (function() {
    let saved = 'light'; try { saved = localStorage.getItem('bgv-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  :root[data-theme="light"] {
    --bg: #FAFAFA; --surface: #FFFFFF; --border: #ECECEC;
    --muted: #6B7280; --text: #1A1A1A; --accent: #2563EB; --accent-soft: #EFF4FF;
    --shadow: rgba(0,0,0,0.03);
    --green-bg: #DCFCE7; --green-text: #16A34A;
    --amber-bg: #FEF3C7; --amber-text: #D97706;
    --red-bg: #FEE2E2; --red-text: #DC2626;
    --grey-bg: #F1F5F9; --grey-text: #64748B;
  }

  :root[data-theme="dark"] {
    --bg: #0D0D0D; --surface: #161616; --border: #2A2A2A;
    --muted: #8A8A8A; --text: #EDEDED; --accent: #C9A04D; --accent-soft: #2A2316;
    --shadow: rgba(0,0,0,0.2);
    --green-bg: #14291C; --green-text: #4ADE80;
    --amber-bg: #2E2310; --amber-text: #F0B429;
    --red-bg: #2E1417; --red-text: #F0506E;
    --grey-bg: #1C1C1C; --grey-text: #8A8A8A;
  }
  /* ===== TOAST NOTIFICATION ===== */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    box-shadow: 0 4px 16px var(--shadow);
    min-width: 240px;
    max-width: 360px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: toast-in 0.25s ease;
  }

  .toast.success { border-left-color: #16A34A; }
  .toast.error { border-left-color: #DC2626; }

  .toast-icon { font-size: 14px; flex-shrink: 0; }

  .toast.toast-out {
    animation: toast-out 0.2s ease forwards;
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toast-out {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(8px); }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; transition: background 0.2s ease, color 0.2s ease; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 56px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .nav-right { display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; transition: background 0.15s ease, color 0.15s ease; }
  .nav-links a:hover { background: var(--bg); color: var(--text); }
  .nav-links a.active { background: var(--accent-soft); color: var(--accent); }

  .theme-toggle { background: none; border: 1px solid var(--border); color: var(--muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: background 0.15s ease, color 0.15s ease; }
  .theme-toggle:hover { background: var(--bg); color: var(--text); }

  main { max-width: 960px; margin: 0 auto; padding: 48px 56px 120px; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 32px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px var(--shadow); margin-bottom: 16px; }

  .batch-row { padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .batch-row:last-child { border-bottom: none; }

  .batch-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  .batch-filename { font-size: 15px; font-weight: 600; }
  .batch-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .batch-status-pill { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 999px; text-transform: capitalize; width: fit-content; }
  .batch-status-pill.completed { background: var(--green-bg); color: var(--green-text); }
  .batch-status-pill.processing { background: var(--amber-bg); color: var(--amber-text); }
  .batch-status-pill.failed { background: var(--red-bg); color: var(--red-text); }
  .batch-status-pill.not_started { background: var(--grey-bg); color: var(--grey-text); }

  .breakdown { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
  .breakdown-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.completed { background: var(--green-text); }
  .dot.partial { background: var(--amber-text); }
  .dot.failed { background: var(--red-text); }
  .dot.pending { background: var(--grey-text); }
  .row-actions { display: flex; align-items: center; gap: 10px; }
  .btn-sm { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-sm:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .progress > div { height: 100%; background: var(--accent); transition: width 0.4s ease; }

  .empty-state, .loading-state { padding: 56px 24px; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 640px) {
    nav { padding: 18px 24px; }
    main { padding: 32px 24px 80px; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-links a, .theme-toggle { white-space: nowrap; }
  @media (max-width: 720px) {
    nav { flex-wrap: wrap; gap: 12px; }
    .nav-right { width: 100%; justify-content: space-between; }
    .nav-links { gap: 2px; overflow-x: auto; }
    .nav-links a { padding: 8px 10px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">BGV</div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html">Overview</a>
      <a href="review.html">Review</a>
      <a href="history.html" class="active">History</a>
      <a href="settings.html">Settings</a>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
  </div>
</nav>

<main>
  <div class="page-title">Batch history</div>

  <div class="card" id="historyList">
    <div class="loading-state">Loading batch history…</div>
  </div>
</main>

<script src="common.js"></script>
<script>
  let timer = null;

  async function processBatch(batchId, btn) {
    btn.disabled = true;
    btn.textContent = 'Starting…';
    try {
      await api(`/candidates/batch/${batchId}/process`, { method: 'POST' });
      showToast(`Batch #${batchId} started.`, 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
    loadHistory();
  }

  function batchRow(b) {
    const s = b.status_breakdown;
    const total = s.pending + s.processing + s.completed + s.partial + s.failed;
    const done = s.completed + s.partial + s.failed;
    const running = b.processing_status === 'processing';
    const action = running
      ? ''
      : (s.pending > 0 ? `<button class="btn-sm" data-batch="${b.batch_id}">${b.processing_status === 'not_started' ? 'Process' : 'Resume'} (${s.pending})</button>` : '');
    const bar = running && total
      ? `<div class="progress" aria-label="Progress"><div style="width:${Math.round(done / total * 100)}%"></div></div>`
      : '';

    return `
      <div class="batch-row">
        <div class="batch-top">
          <div>
            <div class="batch-filename">${esc(b.filename)}</div>
            <div class="batch-meta">Batch #${b.batch_id} · ${b.total_candidates} candidates · ${formatDate(b.created_at, true)}</div>
          </div>
          <div class="row-actions">
            ${action}
            <div class="batch-status-pill ${esc(b.processing_status)}">${esc(b.processing_status.replace('_', ' '))}</div>
          </div>
        </div>
        <div class="breakdown">
          <div class="breakdown-item"><span class="dot completed"></span>${s.completed} verified</div>
          <div class="breakdown-item"><span class="dot partial"></span>${s.partial} partial</div>
          <div class="breakdown-item"><span class="dot failed"></span>${s.failed} failed</div>
          <div class="breakdown-item"><span class="dot pending"></span>${s.pending + s.processing} pending</div>
        </div>
        ${bar}
      </div>`;
  }

  async function loadHistory() {
    clearTimeout(timer);
    const listEl = document.getElementById('historyList');
    try {
      const data = await api('/batches');
      const batches = data.batches || [];

      if (!batches.length) {
        listEl.innerHTML = '<div class="empty-state">No batches uploaded yet.</div>';
        return;
      }

      listEl.innerHTML = batches.map(batchRow).join('');

      // Live-update while anything is running.
      if (batches.some(b => b.processing_status === 'processing')) {
        timer = setTimeout(loadHistory, 3000);
      }
    } catch (err) {
      listEl.innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
    }
  }

  document.getElementById('historyList').addEventListener('click', e => {
    const btn = e.target.closest('[data-batch]');
    if (btn) processBatch(btn.dataset.batch, btn);
  });

  loadHistory();
</script>
</body>
</html>
